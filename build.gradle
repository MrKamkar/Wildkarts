buildscript {
    repositories {
        mavenCentral()
    }
}

allprojects {
    apply plugin: 'java'

    sourceCompatibility = 17
    targetCompatibility = 17

    ext {
        gdxVersion = '1.13.1'
        ashleyVersion = '1.7.4'
        kryonetVersion = '2.22.9'
    }

    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    version = '1.0'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
